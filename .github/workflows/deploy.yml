name: Deploy Production

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_PRIVATE_KEY }}" > ~/.ssh/stockwallah_deploy
          chmod 600 ~/.ssh/stockwallah_deploy
          ssh-keyscan -p "${{ secrets.VPS_PORT || '22' }}" "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy application
        shell: bash
        run: |
          set -euo pipefail
          VPS_PORT="${{ secrets.VPS_PORT || '22' }}"
          ssh -i ~/.ssh/stockwallah_deploy -p "$VPS_PORT" "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" <<'REMOTE'
            set -euo pipefail

            cd /var/www/stockwallah
            git fetch origin main
            git reset --hard origin/main

            cd backend
            npm ci --include=dev
            npx prisma generate
            npx prisma migrate deploy
            npm run build

            cd ../frontend
            npm ci --include=dev
            npm run build

            cd ..
            pm2 restart stockwallah-backend stockwallah-frontend
            pm2 save

            nginx -t
            systemctl reload nginx

            curl -fsS http://127.0.0.1:3000/ >/dev/null
            curl -fsS http://127.0.0.1:4000/health >/dev/null
            curl -fsS http://127.0.0.1:4000/api/settings/public >/dev/null
          REMOTE
