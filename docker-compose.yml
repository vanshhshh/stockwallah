services:
  postgres:
    image: postgres:16-alpine
    container_name: stockwallah-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: stockwallah
      POSTGRES_PASSWORD: stockwallah
      POSTGRES_DB: stockwallah
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockwallah -d stockwallah"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: stockwallah-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stockwallah-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://stockwallah:stockwallah@postgres:5432/stockwallah
      REDIS_URL: redis://redis:6379
      PORT: 4000
      FRONTEND_URL: http://localhost:3000
      JWT_SECRET: ${JWT_SECRET:-change_me_in_production}
      JWT_EXPIRES_IN: 7d
      ADMIN_EMAIL: ${ADMIN_EMAIL:-stockwallahtradingacademy@gmail.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change_me}
      NOTIFICATION_EMAIL: ${NOTIFICATION_EMAIL:-stockwallahtradingacademy@gmail.com}
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "4000:4000"
    command: sh -c "npx prisma db push && npm run seed && npm run dev"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: stockwallah-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    depends_on:
      - backend
    ports:
      - "3000:3000"
    command: npm run dev

volumes:
  postgres-data:
